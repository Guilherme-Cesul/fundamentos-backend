version: "3.8"

services:
  postgres:
    image: postgres
    container_name: fundamentos-backend-pg
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: fundamentos-backend
    volumes:
      - ./data/pg:/data/postgres

  fundamentos-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fundamentos-backend-app
    expose:
      - 3000
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:docker@postgres:5432/fundamentos-backend?schema=public
    restart: on-failure

  nginx:
    image: nginx
    container_name: fundamentos-backend-nginx
    ports:
      - 8080:80
    depends_on:
      - fundamentos-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
